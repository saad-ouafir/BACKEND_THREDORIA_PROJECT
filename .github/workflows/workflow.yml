name: Express Backend CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  DOCKER_IMAGE_NAME: "threadoria_backend"
  GAR_LOCATION: "europe-north1"
  REPOSITORY: "threadoria-repo"
  IMAGE: "threadoria_backend"
  VM_NAME: "backend"
  ZONE: "europe-north1-a"

jobs:
  # Combined Security & Lint Scans (faster than separate jobs)
  security-lint-scan:
    name: Security & Lint Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run RetireJS
        run: |
          npx retire --outputformat json --outputpath retire-report.json || true
          npx retire --severity high
        continue-on-error: true

      - name: Run ESLint
        run: npx eslint . --ext .js, --format json --output-file eslint-report.json || true

      - name: Upload Security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-lint-reports
          path: |
            retire-report.json
            eslint-report.json

  # Snyk Security Scan (separate - uses own action)
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-report.json

      - name: Upload Snyk report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: snyk-report.json

  # OWASP Dependency Check (runs in parallel, not blocking deploy)
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache OWASP DB
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: owasp-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: owasp-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "react-app"
          path: "."
          format: "HTML"
          out: "dependency-check-report"

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: dependency-check-report

  # SonarQube Code Quality Analysis
  sonarqube-scan:
    name: SonarQube Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=saad-ouafir_threadoria-backend
            -Dsonar.organization=saad-ouafir
            -Dsonar.sources=src

  # Build, Push to GAR, and Deploy via SSH
  build-and-deploy:
    name: Build and Deploy to GCP
    runs-on: ubuntu-latest
    needs: [security-lint-scan, snyk-scan, sonarqube-scan]
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "projects/945149895844/locations/global/workloadIdentityPools/github-actions-frontend/providers/github"
          service_account: "threadoria-app-service-account@threadoria-app-project-ynov.iam.gserviceaccount.com"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - name: "Docker Auth"
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/threadoria-app-project-ynov/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "SSH and Restart Container"
        run: |
          DOCKER_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/threadoria-app-project-ynov/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"

          gcloud compute ssh ${{ env.VM_NAME }} \
            --project=threadoria-app-project-ynov \
            --zone=${{ env.ZONE }} \
            --tunnel-through-iap \
            --command="
              sudo gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet
              
              # 1. Fetch the secret from Google Secret Manager on the fly
              DB_PASSWORD=\$(sudo gcloud secrets versions access latest --secret='DB_PASSWORD')
              
              sudo docker stop backend-container || true
              sudo docker rm backend-container || true
              sudo docker pull $DOCKER_TAG
              
              # 2. Inject the secret and the host-level .env into the container
              sudo docker run -d \
                --name backend-container \
                -p 5000:5000 \
                -e DB_PASS=\"\$DB_PASSWORD\" \
                --env-file /home/saad/.env \
                --restart always \
                \$DOCKER_TAG
            "
